; PLC 气密检测上位机配置，保存编码为 UTF-8
[App]
Icon=Icon.ico
WaitTimeoutSec=0
DisplayRecordLimit=1000

[Modbus]
IpAddress=127.0.0.1
Port=502
SlaveId=1
TimeoutMs=1000
PollIntervalMs=500
ReconnectIntervalMs=3000
EnableWriteAck=1

[Register]
StationNoAddr=4002
FlagAddr=4000
AirtightStrAddr=5000
AirtightStrLen=20
AckAddr=4000
AckValue=2
AckValueFail=3
Station1BindingFlagAddr=3000
Station2BindingFlagAddr=3002
Station3BindingFlagAddr=3004
WordOrder=LowHigh
ByteOrder=BigEndian
CharsPerRegister=2
StringByteOrder=LowHigh
StringEncoding=ASCII
StringHeaderBytes=0

[Database]
FilePath=Data\mydb.db
EnableAutoBackup=1
BackupFolder=Data\Backups
BackupIntervalHours=24
BackupRetentionDays=7
EnableIntegrityCheck=1
IntegrityCheckIntervalHours=24
MinimumFreeSpaceMB=10240

[Scanner]
Mode=Keyboard
PortName=COM3
BaudRate=9600
DataBits=8
StopBits=1
Parity=None
LineEnd=13
MinBarcodeLength=6
MaxBarcodeLength=200
KeyboardCharTimeoutMs=100

[Log]
Level=Info
MaxFileSizeMB=10

[Security]
Password=123456

[Manual]
Folder=ProductManual
